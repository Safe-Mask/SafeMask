[package]
name = "safemask-client"
version = "0.1.0"
description = "Client SafeMask das equipes da empresa (servico central on-premise)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
