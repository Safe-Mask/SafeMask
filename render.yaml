services:
  - type: web
    name: safemask-backend
    runtime: python
    runtimeVersion: 3.11
    rootDir: backend
    # tesseract é exigido pelo OCR (pytesseract) para páginas PDF sem camada
    # de texto. Sem ele, upload de PDF só-imagem falhava com 500.
    aptPackages:
      - tesseract-ocr
      - tesseract-ocr-por
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT