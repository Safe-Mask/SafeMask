name: CI backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: safemask
          POSTGRES_PASSWORD: safemask
          POSTGRES_DB: safemask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://safemask:safemask@localhost:5432/safemask_test
      SECRET_KEY: ci-only-secret-key-not-used-in-production-000000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app scanner tests

      - name: Testes (pytest)
        run: python -m pytest -q --cov=app --cov=scanner --cov-report=term

      # Cobertura de app/ e scanner/ no resumo da execucao (PI-III #16).
      - name: Publicar a cobertura no resumo
        if: always()
        run: |
          echo "## Cobertura dos testes" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verificar que a app importa
        run: python -c "from app.main import app; print(app.title)"

  interface:
    # Teste de interface (PI-III #16): navegador de verdade (Chromium do
    # Playwright) contra a API e as telas, com banco e pasta descartaveis.
    name: interface (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias e o navegador
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Teste de interface
        env:
          SAFEMASK_TESTE_INTERFACE: '1'
        run: python -m pytest tests_interface -v

  docker:
    # Docker Compose (PI-III #232): monta a imagem, sobe Postgres, API e telas,
    # cria os dados de demonstracao, faz login e confere que eles sobrevivem
    # a um reinicio da API.
    name: docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Subir Postgres, API e telas
        run: docker compose up -d --build --wait

      - name: Conferir API e telas
        run: |
          curl -fsS http://localhost:8000/ | grep -q online
          curl -fsS http://localhost:8080/frontend/js/config.js | grep -q "http://localhost:8000"
          curl -fsS http://localhost:8080/frontend/html/auth/login.html | grep -q SafeMask
          docker compose exec -T api sh -c "tesseract --list-langs 2>&1" | grep -q por

      - name: Dados de demonstracao e login
        run: |
          docker compose run --rm -T api python -m app.tarefas.popular_demo | tee demo.txt
          grep -q "Documentos criados agora: 2" demo.txt
          SENHA=$(sed -n 's/^Senha das contas: //p' demo.txt)
          curl -fsS -X POST http://localhost:8000/auth/login -H "Content-Type: application/json" \
            -d "{\"email\":\"lider.demo@safemask.example.com\",\"senha_hash\":\"$SENHA\"}" | grep -q access_token

      - name: Dados persistem depois de reiniciar
        run: |
          docker compose restart api
          docker compose up -d --wait
          docker compose run --rm -T api python -m app.tarefas.popular_demo | grep -q "já existem: 2"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail 100

      - name: Derrubar
        if: always()
        run: docker compose down -v
